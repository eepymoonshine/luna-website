<section class="now-playing" id="now-playing" hidden>
  <h2 class="now-playing-heading">🎵 Now Playing&hellip;</h2>
  <div class="now-playing-row">
    <img class="now-playing-art" id="np-art" alt="">
    <div class="now-playing-info">
      <a class="now-playing-title" id="np-title" target="_blank" rel="noopener"></a>
      <div class="bar now-playing-bar">
        <div class="bar-fill" id="np-bar-fill"></div>
      </div>
      <div class="now-playing-sub" id="np-sub"></div>
    </div>
  </div>
</section>

<section class="status-panel">
  <h2>
    <span class="status-heading-title"><span id="status-dot" class="status-dot"></span> <span id="status-title">Server status</span></span>
    <div class="containers-list" id="containers-list"></div>
  </h2>
  <div class="status-metrics">
    <div class="metric">
      <div class="label">CPU</div>
      <div class="value" id="m-cpu">–</div>
      <div class="bar"><div class="bar-fill" id="m-cpu-bar"></div></div>
    </div>
    <div class="metric">
      <div class="label">Memory</div>
      <div class="value" id="m-mem">–</div>
      <div class="bar"><div class="bar-fill" id="m-mem-bar"></div></div>
    </div>
    <div class="metric">
      <div class="label">Disk</div>
      <div class="value" id="m-disk">–</div>
      <div class="bar"><div class="bar-fill" id="m-disk-bar"></div></div>
    </div>
  </div>

  <div class="cpu-graph">
    <div class="label"><span>CPU usage</span><span id="cpu-current">–</span></div>
    <svg id="cpu-sparkline" viewBox="0 0 100 40" preserveAspectRatio="none">
      <polyline id="cpu-sparkline-line" fill="none" stroke="#37d8d0" stroke-width="2" points=""></polyline>
    </svg>
  </div>

  <div class="status-footer">
    <span id="m-uptime"></span>
    <span class="status-updated" id="status-updated"></span>
  </div>
</section>
