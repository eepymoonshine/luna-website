server {
	listen 8080;
	listen [::]:8080;
	server_name eepymoonshine.world www.eepymoonshine.world;

	root /var/www/eepymoonshine-public;
	index index.html;

	location = /metro { absolute_redirect off; return 301 /metro/; }
	location /metro/ {
		proxy_pass http://10.88.0.1:8765/;
		proxy_set_header Host $host;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
